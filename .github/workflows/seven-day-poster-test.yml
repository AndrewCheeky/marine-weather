name: Marine7 Master Cache TEST (isolated, read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marine7-master-cache-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout staging snapshot
        uses: actions/checkout@v4

      - name: Validate isolated Marine7DayCache export
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const file='instagram/seven-day-test/marine7-test-data.json';
          const fail=msg=>{console.error('MARINE7 VALIDATION FAILED: '+msg);process.exitCode=1;};
          let data;
          try { data=JSON.parse(readFileSync(file,'utf8')); }
          catch(e){fail(`Cannot read ${file}: ${e.message}`);process.exit();}
          const rows=Array.isArray(data)?data:Array.isArray(data?.rows)?data.rows:null;
          if(!rows){fail('Expected a JSON array or {rows:[...]}');process.exit();}
          if(rows.length!==98)fail(`Expected 98 rows, found ${rows.length}`);
          const sites=new Set(),dates=new Set(),pairs=new Set();
          const pick=(r,...keys)=>keys.map(k=>r[k]).find(v=>v!==null&&v!==undefined&&String(v).trim()!=='');
          for(const [i,r] of rows.entries()){
            if(!r||typeof r!=='object'||Array.isArray(r)){fail(`Row ${i+1}: invalid object`);continue;}
            const site=pick(r,'locationKey','siteKey','location');
            const date=pick(r,'forecastDate','date');
            if(!site||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(String(date??''))){fail(`Row ${i+1}: missing site/date`);continue;}
            const key=`${site}|${date}`;
            if(pairs.has(key))fail(`Duplicate site/date: ${key}`);
            pairs.add(key);sites.add(String(site));dates.add(String(date));
            const score=pick(r,'comfortScore');
            if(score===undefined||!Number.isFinite(Number(score))||Number(score)<0||Number(score)>5)fail(`Row ${i+1}: missing/invalid v3 comfort score`);
            const status=String(pick(r,'comfortStatus')??'').toUpperCase();
            if(!['GREEN','YELLOW','RED'].includes(status))fail(`Row ${i+1}: missing/invalid v3 status`);
            if(Object.keys(r).some(k=>/^comfort(?:Score|Status)?V[0-9]+$/i.test(k)))fail(`Row ${i+1}: versioned comfort fields are not allowed; use comfortScore and comfortStatus`);
            const safety=String(pick(r,'safetyStatus')??'');
            const trip=String(pick(r,'tripValidation','windowStatus')??'');
            if(!safety)fail(`Row ${i+1}: missing safety status`);
            if(!trip)fail(`Row ${i+1}: missing trip verification`);
            // The staging export must never claim independently verified marine safety.
            if(safety==='VERIFIED'||trip==='VERIFIED')fail(`Row ${i+1}: unsupported VERIFIED claim`);
          }
          if(sites.size!==14)fail(`Expected 14 sites, found ${sites.size}`);
          if(dates.size!==7)fail(`Expected 7 dates, found ${dates.size}`);
          for(const site of sites)for(const date of dates)if(!pairs.has(`${site}|${date}`))fail(`Missing ${site} on ${date}`);
          console.log(`Marine7 snapshot checked: ${rows.length} records, ${sites.size} sites, ${dates.size} days`);
          if(process.exitCode)process.exit(process.exitCode);
          console.log('PASS: v3-only scoring; no live services or external weather endpoints called.');
          NODE
