name: Seven-Day Poster TEST (isolated)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: seven-day-poster-test
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore latest generated files from the data branch
        run: bash scripts/data-branch.sh restore
      - name: Install renderer
        run: npm install --no-save --no-audit --no-fund sharp@0.34.4
      - name: Generate master-cache test posters
        env:
          SEVEN_DAY_DATA_URL: ${{ secrets.SEVEN_DAY_DATA_URL }}
          MARINE7_TEST: '1'
        run: node scripts/generate-seven-day.mjs
      - name: Publish test images to the data branch
        run: bash scripts/data-branch.sh publish 'Generate isolated seven-day test posters' instagram/seven-day-test
