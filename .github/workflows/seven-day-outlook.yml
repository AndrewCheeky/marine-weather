name: Seven-Day Marine Outlook
on:
  schedule:
    - cron: '45 11 * * *' # 06:45 Jamaica time
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: seven-day-outlook
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Sharp
        run: npm install --no-save --no-audit --no-fund sharp@0.34.4
      - name: Render seven days from standardized master cache
        env:
          SEVEN_DAY_DATA_URL: ${{ secrets.SEVEN_DAY_DATA_URL }}
        run: node scripts/generate-seven-day.mjs
      - name: Verify all seven dated PNG and JSON files
        run: |
          node --input-type=module <<'NODE'
          import {readFile,stat} from 'node:fs/promises';
          import {resolve} from 'node:path';
          const root='instagram/generated';
          const manifest=JSON.parse(await readFile(resolve(root,'seven-day-manifest.json'),'utf8'));
          if(!Array.isArray(manifest.days)||manifest.days.length!==7) throw Error('Manifest must contain exactly seven days');
          const dates=manifest.days.map(d=>d.date);
          if(new Set(dates).size!==7 || dates.some(d=>!/^\d{4}-\d{2}-\d{2}$/.test(d))) throw Error('Invalid or duplicate dates');
          for(const date of dates){
            const base=resolve(root,`seven-day-${date}`);
            const png=await readFile(`${base}.png`);
            if(png.length<100 || !png.subarray(0,8).equals(Buffer.from([137,80,78,71,13,10,26,10]))) throw Error(`Missing/invalid PNG: ${date}`);
            const json=JSON.parse(await readFile(`${base}.json`,'utf8'));
            if(!json || typeof json!=='object') throw Error(`Invalid JSON: ${date}`);
            console.log(`Verified ${date}: PNG ${png.length} bytes; JSON present`);
          }
          console.log('All seven dated PNG/JSON pairs verified.');
          NODE
      - name: Publish seven-day posters
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f instagram/generated/seven-day-*.png instagram/generated/seven-day-*.json instagram/generated/seven-day-manifest.json
          if git diff --cached --quiet; then
            echo 'All seven pairs verified; generated assets are identical to committed versions.'
            exit 0
          fi
          git commit -m 'Update seven-day marine outlook'
          git pull --rebase origin main
          git push origin HEAD:main
