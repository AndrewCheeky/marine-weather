name: Daily Today and Tomorrow Marine Forecast PNGs
on:
  schedule:
    - cron: '30 11 * * *' # 06:30 Jamaica time, year-round
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-instagram
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local poster server
        run: |
          test -f instagram/index.html
          test -f instagram/sunset-background.jpg
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/marine-poster-http.log 2>&1 &
          echo $! > /tmp/marine-poster-http.pid
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/instagram/ -o /dev/null; then
              echo 'Local poster page is available.'
              break
            fi
            sleep 1
          done
          curl --fail --show-error --silent http://127.0.0.1:8765/instagram/ -o /dev/null
      - name: Generate independently
        id: generate
        continue-on-error: true
        env:
          POSTER_URL: http://127.0.0.1:8765/instagram/
        run: node scripts/generate-instagram.mjs
      - name: Commit any successfully generated PNGs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add instagram/generated/*.png
          if ! git diff --cached --quiet; then
            git commit -m 'Update marine forecast Instagram PNGs'
            git push
          else
            echo 'No new images to commit; check generator logs.'
          fi
      - name: Report complete failure
        if: steps.generate.outcome == 'failure'
        run: |
          echo 'Neither image was generated. Check generator logs above.'
          exit 1
