name: Daily Today and Tomorrow Marine Forecast PNGs
on:
  schedule:
    - cron: '30 11 * * *' # 06:30 Jamaica time, year-round
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-instagram
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Generate independently
        id: generate
        continue-on-error: true
        env:
          POSTER_URL: https://marine-weather.andrewcheeky.com/instagram/
        run: node scripts/generate-instagram.mjs
      - name: Commit any successfully generated PNGs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add instagram/generated/*.png
          if ! git diff --cached --quiet; then
            git commit -m 'Update marine forecast Instagram PNGs'
            git push
          else
            echo 'No new images to commit; check generator logs.'
          fi
      - name: Report complete failure
        if: steps.generate.outcome == 'failure'
        run: |
          echo 'Neither image was generated. Check generator logs above.'
          exit 1
