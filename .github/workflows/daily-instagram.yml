name: Daily Marine Forecast PNG
on:
  schedule:
    - cron: '30 10 * * *' # 05:30 Jamaica (UTC-5), primary
    - cron: '30 11 * * *' # 06:30 Jamaica (UTC-5), retry if missing
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-instagram
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check if tomorrow's image already exists
        id: freshness
        shell: bash
        run: |
          TODAY=$(TZ=America/Jamaica date -d "tomorrow" +%F)
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch: force regenerating tomorrow's graphic."
            echo "needed=true" >> "$GITHUB_OUTPUT"
          elif [ -s "instagram/generated/marine-weather-jamaica-${TODAY}.png" ]; then
            echo "Tomorrow's dated PNG already exists; skipping generation."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tomorrow's PNG is missing; generating it."
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Sharp renderer
        if: steps.freshness.outputs.needed == 'true'
        run: npm install --no-save --no-audit --no-fund sharp@0.34.4
      - name: Generate tomorrow's PNG directly (no browser)
        if: steps.freshness.outputs.needed == 'true'
        run: node scripts/generate-instagram-sharp.mjs
      - name: Commit generated PNGs
        if: steps.freshness.outputs.needed == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add instagram/generated/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Update marine forecast Instagram PNGs for ${{ steps.freshness.outputs.today }}"
            git push
          else
            echo 'Generator succeeded but no image changes were staged.'
          fi
