name: Daily Marine Forecast PNG
on:
  schedule:
    # Times are UTC; Jamaica is UTC-5 all year. Odd minutes avoid GitHub's busiest
    # moments (on the hour / half hour), when scheduled runs are delayed or dropped.
    - cron: '37 10 * * *' # 05:37 Jamaica, primary
    - cron: '37 11 * * *' # 06:37 Jamaica, retry if missing/stale
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-instagram
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore latest generated files from the data branch
        run: bash scripts/data-branch.sh restore
      - name: Determine which forecast images need generating
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          TODAY=$(TZ=America/Jamaica date +%F)
          echo "TODAY_JA=$TODAY" >> "$GITHUB_ENV"
          TOMORROW=$(TZ=America/Jamaica date -d tomorrow +%F)
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          echo "tomorrow=$TOMORROW" >> "$GITHUB_OUTPUT"
          # At 05:30 always refresh both. At 06:30 retry only missing/invalid images.
          # Manual dispatch refreshes both to make verification straightforward.
          RETRY=false
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "37 11 * * *" ]; then RETRY=true; fi
          for DAY_KIND in today tomorrow; do
            if [ "$DAY_KIND" = today ]; then EXPECTED="$TODAY"; else EXPECTED="$TOMORROW"; fi
            NEEDED=true
            if [ "$RETRY" = true ]; then
              if EXPECTED="$EXPECTED" KIND="$DAY_KIND" node --input-type=module <<'NODE'
          import {readFile,stat} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {resolve} from 'node:path';
          const kind=process.env.KIND, day=process.env.EXPECTED;
          try {
            const root=resolve('instagram/generated');
            const metadata=JSON.parse(await readFile(resolve(root,`${kind}-freshness.json`),'utf8'));
            const png=await readFile(resolve(root,`${kind}.png`));
            const dated=await readFile(resolve(root,`marine-weather-jamaica-${day}.png`));
            const hash=createHash('sha256').update(png).digest('hex');
            const generated=new Date(metadata.generatedAt);
            const localDay=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Jamaica',year:'numeric',month:'2-digit',day:'2-digit'}).format(generated);
            if(metadata.selection!==kind||metadata.forecastDay!==day||localDay!==process.env.TODAY_JA||
               !Number.isFinite(generated.getTime())||metadata.sha256!==hash||
               !png.equals(dated)||png.length<20000)process.exit(1);
          } catch {process.exit(1);}
          NODE
              then NEEDED=false; fi
            fi
            echo "${DAY_KIND}_needed=$NEEDED" >> "$GITHUB_OUTPUT"
            echo "$DAY_KIND ($EXPECTED): needed=$NEEDED"
          done
      - name: Install Sharp renderer
        if: steps.freshness.outputs.today_needed == 'true' || steps.freshness.outputs.tomorrow_needed == 'true'
        run: npm install --no-save --no-audit --no-fund sharp@0.34.4
      - name: Generate today's forecast PNG
        id: generate_today
        continue-on-error: true
        if: steps.freshness.outputs.today_needed == 'true'
        run: node scripts/generate-instagram-sharp.mjs --day today
      - name: Generate tomorrow's forecast PNG
        id: generate_tomorrow
        continue-on-error: true
        if: steps.freshness.outputs.tomorrow_needed == 'true'
        run: node scripts/generate-instagram-sharp.mjs --day tomorrow
      - name: Publish generated PNGs and freshness records to the data branch
        if: always() && (steps.generate_today.outcome == 'success' || steps.generate_tomorrow.outcome == 'success')
        run: bash scripts/data-branch.sh publish 'Update today and tomorrow marine forecast PNGs' 'instagram/generated/today*' 'instagram/generated/tomorrow*' 'instagram/generated/daily-forecast-freshness.json' 'instagram/generated/marine-weather-jamaica-*.png'
      - name: Report any forecast generation failures
        if: always() && (steps.generate_today.outcome == 'failure' || steps.generate_tomorrow.outcome == 'failure')
        run: |
          echo 'One or both forecast images failed; successful outputs were preserved and published where possible.' >&2
          exit 1
