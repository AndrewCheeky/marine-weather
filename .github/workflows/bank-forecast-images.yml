name: Cached Bank Forecast Images
on:
  schedule:
    - cron: '0 2,5,8,11,14,17,20,23 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bank-forecast-images
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore latest generated files from the data branch
        run: bash scripts/data-branch.sh restore
      - run: |
          npm install --no-save playwright@1.56.1 sharp@0.34.4
          npx playwright install --with-deps chromium
      - name: Publish complete hourly forecasts from Google Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/publish-bank-24h.mjs
      - name: Render available bank forecasts
        id: render
        continue-on-error: true
        run: node scripts/generate-bank-forecasts.mjs
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bank-forecast-diagnostics
          path: banks/diagnostics/latest.json
          if-no-files-found: warn
      - name: Publish rendered images and hourly data to the data branch
        run: bash scripts/data-branch.sh publish 'Refresh cached fishing bank forecast images' banks/generated banks/hourly banks/locations.json
      - name: Fail if no forecasts rendered
        if: steps.render.outcome == 'failure'
        run: exit 1
