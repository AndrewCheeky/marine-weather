name: Marine Visual Pilot (manual)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore latest generated files from the data branch
        run: bash scripts/data-branch.sh restore
      - run: npm install --no-save --no-audit --no-fund sharp@0.34.4
      - name: Validate complete 24-hour forecast from Google Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PILOT_REQUIRE_24H: '1'
        run: node scripts/fetch-pilot-24h.mjs
      - run: node scripts/generate-pilot-components.mjs
      - name: Publish pilot graphics to the data branch
        run: bash scripts/data-branch.sh publish 'Refresh standalone marine visual pilot' pilot/generated pilot/cache
