<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seven-day marine forecast | TEST</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f4f9fd;background:#061c2d}*{box-sizing:border-box}body{margin:0;padding:20px 12px}main{max-width:750px;margin:auto}h1{font-size:1.4rem;margin:0 0 6px}.intro{color:#bcd4e4;font-size:.9rem;margin:0 0 16px}.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.day{border:2px solid transparent;border-radius:10px;padding:12px 2px;cursor:pointer;color:white;font-weight:800;background:#65717d;min-width:0}.day span{display:block;font-size:.72rem;margin-top:3px}.day.green{background:#168348}.day.yellow{background:#bc830c}.day.red{background:#b63738}.day.unknown{background:#65717d}.day[aria-pressed=true]{outline:3px solid #fff;outline-offset:2px}.day:focus-visible{outline:3px solid white;outline-offset:2px}.period{margin:12px 0 10px;padding:12px 14px;border-radius:8px;background:#123c55;font-weight:800}.period.extended{border-left:5px solid #e39425}.period.short-range{border-left:5px solid #2ab66a}.note{font-size:.8rem;color:#c1d5e2;margin:0 0 12px}.poster{width:100%;height:auto;display:block;border-radius:10px}.full{color:#9be1ff;display:inline-block;margin:12px 0}#error{padding:18px;border:1px solid #ad7a30;border-radius:8px}#error[hidden]{display:none}@media(max-width:460px){.day{font-size:.78rem;padding:10px 1px}.day span{font-size:.65rem}}</style></head><body><main><h1>Seven-day marine outlook <small>TEST</small></h1><p class="intro">Kingston / Maiden Cay · 7:00 AM–5:00 PM Jamaica time</p><div id="days" class="days" role="group" aria-label="Choose forecast date"></div><div id="period" class="period" hidden></div><p class="note">Button colours reflect the provisional Kingston marine condition, not forecast confidence. Grey means unrated. Extended outlooks carry greater uncertainty.</p><div id="error" hidden></div><img id="poster" class="poster" alt="Selected seven-day marine forecast" hidden><a id="full" class="full" href="#" target="_blank" rel="noopener" hidden>View full-size poster</a></main><script>
(async()=>{const nav=document.getElementById('days'),period=document.getElementById('period'),img=document.getElementById('poster'),full=document.getElementById('full'),err=document.getElementById('error');try{const r=await fetch('./manifest.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('No test manifest yet. Run the isolated GitHub workflow first.');const m=await r.json();if(!Array.isArray(m.days)||m.days.length!==7)throw Error('Seven complete forecast days are required.');function select(i){const d=m.days[i];const extended=i>=3;period.hidden=false;period.className='period '+(extended?'extended':'short-range');period.textContent=extended?'EXTENDED OUTLOOK · DAYS 4–7 · GREATER UNCERTAINTY':'SHORT-RANGE FORECAST · DAYS 1–3';const path='./'+encodeURIComponent(d.image);img.src=path+'?v='+encodeURIComponent(m.generatedAt||'');img.alt='Marine forecast for '+d.date+'; provisional Kingston status '+(d.status||'unrated');img.hidden=false;full.href=path;full.hidden=false;Array.from(nav.children).forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));}m.days.forEach((d,i)=>{const dt=new Date(d.date+'T12:00:00Z'),weekday=new Intl.DateTimeFormat('en-US',{weekday:'short',timeZone:'UTC'}).format(dt),status=String(d.status||'').toUpperCase(),cls=['GREEN','YELLOW','RED'].includes(status)?status.toLowerCase():'unknown';const b=document.createElement('button');b.type='button';b.className='day '+cls;b.innerHTML=weekday+'<span>'+dt.getUTCDate()+'</span>';b.title=(status||'Unrated')+' · '+(i>=3?'Extended outlook':'Short-range forecast')+' · provisional';b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>select(i));nav.appendChild(b)});select(0);}catch(e){err.hidden=false;err.textContent=e.message}})();
</script></body></html>
